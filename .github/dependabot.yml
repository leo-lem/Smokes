version: 2
updates:
  # For the Vercel API (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # For Swift library packages
  - package-ecosystem: "swift"
    directory: "/features"
    schedule:
      interval: "weekly"
  - package-ecosystem: "swift"
    directory: "/library"
    schedule:
      interval: "weekly"